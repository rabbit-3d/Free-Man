// CONTEXTO: sesión (nombre del cliente / modo admin)
// ============================================================
const SessionContext = createContext(null);
const STORAGE_KEY = 'freeman_customer_name';

function SessionProvider({ children }) {
  const [customerName, setCustomerName] = useState('');
  const [isAdmin, setIsAdmin] = useState(false);
  const [profileOpen, setProfileOpen] = useState(false);

  useEffect(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) setCustomerName(saved);
  }, []);

  const submitIdentity = useCallback((value) => {
    const trimmed = value.trim();
    if (!trimmed) return null;
    if (trimmed === ADMIN_CODE) {
      setIsAdmin(true);
      return 'admin';
    }
    setCustomerName(trimmed);
    localStorage.setItem(STORAGE_KEY, trimmed);
    setIsAdmin(false);
    return 'saved';
  }, []);

  const logout = useCallback(() => {
    setIsAdmin(false);
    setCustomerName('');
    localStorage.removeItem(STORAGE_KEY);
  }, []);

  const value = { customerName, isAdmin, submitIdentity, logout, profileOpen, setProfileOpen };
  return <SessionContext.Provider value={value}>{children}</SessionContext.Provider>;
}
const useSession = () => useContext(SessionContext);

// CONTEXTO: carrito
// ============================================================
const CartContext = createContext(null);

function CartProvider({ children }) {
  const [items, setItems] = useState([]);
  const [isOpen, setIsOpen] = useState(false);

  const addItem = useCallback((entry, note = '') => {
    setItems((prev) => {
      const key = `${entry.kind}-${entry.id}-${note}`;
      const existing = prev.find((i) => i.key === key);
      if (existing) return prev.map((i) => (i.key === key ? { ...i, qty: i.qty + 1 } : i));
      return [...prev, { key, id: entry.id, kind: entry.kind, name: entry.name, price: entry.price, qty: 1, note }];
    });
    setIsOpen(true);
  }, []);

  const updateQty = useCallback((key, delta) => {
    setItems((prev) => prev.map((i) => (i.key === key ? { ...i, qty: i.qty + delta } : i)).filter((i) => i.qty > 0));
  }, []);

  const removeItem = useCallback((key) => setItems((prev) => prev.filter((i) => i.key !== key)), []);
  const clearCart = useCallback(() => setItems([]), []);

  const total = useMemo(() => items.reduce((sum, i) => sum + i.price * i.qty, 0), [items]);
  const count = useMemo(() => items.reduce((sum, i) => sum + i.qty, 0), [items]);

  const value = { items, addItem, updateQty, removeItem, clearCart, total, count, isOpen, setIsOpen };
  return <CartContext.Provider value={value}>{children}</CartContext.Provider>;
}
const useCart = () => useContext(CartContext);

function buildOrderMessage(customerName, items, total) {
  const lines = [];
  lines.push(`¡Hola Free Man Pizzería! Soy ${customerName} y quiero hacer este pedido:`);
  lines.push('');
  items.forEach((i) => {
    const label = i.kind === 'promo' ? `${i.name} (promo)` : i.name;
    let line = `• ${i.qty}x ${label} — ${money(i.price * i.qty)}`;
    if (i.note) line += `\n   Nota: ${i.note}`;
    lines.push(line);
  });
  lines.push('');
  lines.push(`Total: ${money(total)}`);
  return lines.join('\n');
}

function openWhatsAppOrder(customerName, items, total) {
  const message = buildOrderMessage(customerName, items, total);
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank', 'noopener,noreferrer');
}

function ProfileModal() {
  const { profileOpen, setProfileOpen, submitIdentity } = useSession();
  const [value, setValue] = useState('');
  const [feedback, setFeedback] = useState(null);

  if (!profileOpen) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    const result = submitIdentity(value);
    if (result === 'admin') {
      setFeedback('admin');
      setTimeout(() => { setProfileOpen(false); setFeedback(null); setValue(''); }, 900);
    } else if (result === 'saved') {
      setProfileOpen(false);
      setValue('');
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 p-4 sm:items-center" onClick={() => setProfileOpen(false)}>
      <div className="w-full max-w-sm rounded-2xl bg-[var(--paper)] p-6 shadow-xl" onClick={(e) => e.stopPropagation()}>
        {feedback === 'admin' ? (
          <p className="text-center font-display text-lg text-[var(--navy)]">Modo administrador activado ✓</p>
        ) : (
          <>
            <h2 className="font-display text-xl text-[var(--navy)]">¿Quién sos?</h2>
            <p className="mt-1 text-sm text-[var(--charcoal)]/70">
              Poné tu nombre y apellido: lo vamos a usar para firmar tu pedido de WhatsApp.
            </p>
            <form onSubmit={handleSubmit} className="mt-4 flex flex-col gap-3">
              <input autoFocus value={value} onChange={(e) => setValue(e.target.value)} placeholder="Nombre y apellido"
                className="rounded-lg border border-black/15 bg-white px-4 py-2.5 outline-none focus:border-[var(--navy)]" />
              <button type="submit" className="rounded-lg bg-[var(--navy)] py-2.5 font-semibold text-[var(--cream)] transition hover:bg-[var(--navy-2)]">
                Continuar
              </button>
              <button type="button" onClick={() => setProfileOpen(false)} className="text-sm text-[var(--charcoal)]/60 underline-offset-2 hover:underline">
                Cancelar
              </button>
            </form>
          </>
        )}
      </div>
    </div>
  );
}

function PromoFormModal({ promo, onClose, onSaved }) {
  const isNew = !promo.id;
  const [title, setTitle] = useState(promo.title || '');
  const [description, setDescription] = useState(promo.description || '');
  const [price, setPrice] = useState(promo.price ?? '');
  const [active, setActive] = useState(promo.active ?? true);
  const [saving, setSaving] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSaving(true);
    const payload = { title, description, price: Number(price) || 0, active };
    if (isNew) await db.from(TABLES.promos).insert(payload);
    else await db.from(TABLES.promos).update(payload).eq('id', promo.id);
    setSaving(false);
    onSaved();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 p-4 sm:items-center" onClick={onClose}>
      <form onSubmit={handleSubmit} onClick={(e) => e.stopPropagation()} className="w-full max-w-sm rounded-2xl bg-[var(--paper)] p-6 shadow-xl">
        <h2 className="font-display text-xl text-[var(--navy)]">{isNew ? 'Nueva promo' : 'Editar promo'}</h2>
        <label className="mt-4 block text-sm font-medium">Título</label>
        <input required value={title} onChange={(e) => setTitle(e.target.value)} className="mt-1 w-full rounded-lg border border-black/15 bg-white px-3 py-2" placeholder="Ej: 1 Muzza + 1 Docena" />
        <label className="mt-3 block text-sm font-medium">Detalle (opcional)</label>
        <input value={description} onChange={(e) => setDescription(e.target.value)} className="mt-1 w-full rounded-lg border border-black/15 bg-white px-3 py-2" />
        <label className="mt-3 block text-sm font-medium">Precio</label>
        <input required type="number" min="0" value={price} onChange={(e) => setPrice(e.target.value)} className="mt-1 w-full rounded-lg border border-black/15 bg-white px-3 py-2" />
        <label className="mt-3 flex items-center gap-2 text-sm">
          <input type="checkbox" checked={active} onChange={(e) => setActive(e.target.checked)} /> Visible en la web
        </label>
        <div className="mt-5 flex gap-2">
          <button type="submit" disabled={saving} className="flex-1 rounded-lg bg-[var(--navy)] py-2.5 font-semibold text-[var(--cream)] disabled:opacity-60">
            {saving ? 'Guardando…' : 'Guardar'}
          </button>
          <button type="button" onClick={onClose} className="rounded-lg border border-black/15 px-4 py-2.5">Cancelar</button>
        </div>
      </form>
    </div>
  );
}

const chalkColors = ['text-[var(--chalk-white)]', 'text-[var(--chalk-pink)]', 'text-[var(--chalk-yellow)]'];

function PromoBoard() {
  const [promos, setPromos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const { isAdmin } = useSession();
  const { addItem } = useCart();

  const load = async () => {
    setLoading(true);
    const { data, error } = await db.from(TABLES.promos).select('*').order('sort_order', { ascending: true });
    if (!error) setPromos(data || []);
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const visible = isAdmin ? promos : promos.filter((p) => p.active);

  const handleDelete = async (id) => {
    if (!confirm('¿Eliminar esta promo?')) return;
    await db.from(TABLES.promos).delete().eq('id', id);
    load();
  };

  if (!loading && visible.length === 0 && !isAdmin) return null;

  return (
    <section className="mx-auto -mt-8 max-w-5xl px-4">
      <div className="chalkboard rounded-2xl border-8 border-[#3a2b1c] p-6 shadow-xl sm:p-8">
        <div className="mb-4 flex items-center justify-between">
          <h2 className="font-display text-2xl text-[var(--chalk-yellow)]">Promos de hoy</h2>
          {isAdmin && (
            <button onClick={() => setEditing({})} className="rounded-full bg-[var(--mustard)] px-3 py-1 text-xs font-semibold text-[var(--charcoal)]">
              + Agregar promo
            </button>
          )}
        </div>
        <div className="grid gap-x-8 gap-y-4 sm:grid-cols-2">
          {visible.map((promo, idx) => (
            <div key={promo.id} className={`group ${promo.active ? '' : 'opacity-40'}`}>
              <div className="flex items-start justify-between gap-3">
                <p className={`font-display text-lg leading-tight ${chalkColors[idx % chalkColors.length]}`}>{promo.title}</p>
                <p className="font-display whitespace-nowrap text-lg text-[var(--chalk-yellow)]">{money(promo.price)}</p>
              </div>
              {promo.description && <p className="text-xs text-white/50">{promo.description}</p>}
              <div className="mt-1 flex gap-3">
                <button onClick={() => addItem({ id: promo.id, kind: 'promo', name: promo.title, price: promo.price })}
                  className="text-xs font-semibold text-[var(--chalk-white)] underline decoration-dotted underline-offset-4 hover:text-[var(--mustard)]">
                  Agregar al pedido
                </button>
                {isAdmin && (
                  <>
                    <button onClick={() => setEditing(promo)} className="text-xs text-white/50 hover:text-white">Editar</button>
                    <button onClick={() => handleDelete(promo.id)} className="text-xs text-white/50 hover:text-red-300">Eliminar</button>
                  </>
                )}
              </div>
            </div>
          ))}
        </div>
      </div>
      {editing !== null && (
        <PromoFormModal promo={editing} onClose={() => setEditing(null)} onSaved={() => { setEditing(null); load(); }} />
      )}
    </section>
  );
}

function ProductFormModal({ product, defaultCategory, onClose, onSaved }) {
  const isNew = !product.id;
  const CATEGORIES = [
    { value: 'pizzas', label: 'Pizzas' },
    { value: 'empanadas', label: 'Empanadas' },
    { value: 'especialidades', label: 'Especialidades' },
  ];
  const [name, setName] = useState(product.name || '');
  const [category, setCategory] = useState(product.category || defaultCategory || 'pizzas');
  const [price, setPrice] = useState(product.price ?? '');
  const [description, setDescription] = useState(product.description || '');
  const [active, setActive] = useState(product.active ?? true);
  const [saving, setSaving] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSaving(true);
    const payload = { name, category, price: Number(price) || 0, description, active };
    if (isNew) await db.from(TABLES.products).insert(payload);
    else await db.from(TABLES.products).update(payload).eq('id', product.id);
    setSaving(false);
    onSaved();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 p-4 sm:items-center" onClick={onClose}>
      <form onSubmit={handleSubmit} onClick={(e) => e.stopPropagation()} className="w-full max-w-sm rounded-2xl bg-[var(--paper)] p-6 shadow-xl">
        <h2 className="font-display text-xl text-[var(--navy)]">{isNew ? 'Nuevo producto' : 'Editar producto'}</h2>
        <label className="mt-4 block text-sm font-medium">Nombre</label>
        <input required value={name} onChange={(e) => setName(e.target.value)} className="mt-1 w-full rounded-lg border border-black/15 bg-white px-3 py-2" />
        <label className="mt-3 block text-sm font-medium">Categoría</label>
        <select value={category} onChange={(e) => setCategory(e.target.value)} className="mt-1 w-full rounded-lg border border-black/15 bg-white px-3 py-2">
          {CATEGORIES.map((c) => <option key={c.value} value={c.value}>{c.label}</option>)}
        </select>
        <label className="mt-3 block text-sm font-medium">Precio</label>
        <input required type="number" min="0" value={price} onChange={(e) => setPrice(e.target.value)} className="mt-1 w-full rounded-lg border border-black/15 bg-white px-3 py-2" />
        <label className="mt-3 block text-sm font-medium">Descripción (opcional)</label>
        <textarea value={description} onChange={(e) => setDescription(e.target.value)} rows={2} className="mt-1 w-full rounded-lg border border-black/15 bg-white px-3 py-2" placeholder="Ej: sabores disponibles, ingredientes, etc." />
        <label className="mt-3 flex items-center gap-2 text-sm">
          <input type="checkbox" checked={active} onChange={(e) => setActive(e.target.checked)} /> Visible en la web
        </label>
        <div className="mt-5 flex gap-2">
          <button type="submit" disabled={saving} className="flex-1 rounded-lg bg-[var(--navy)] py-2.5 font-semibold text-[var(--cream)] disabled:opacity-60">
            {saving ? 'Guardando…' : 'Guardar'}
          </button>
          <button type="button" onClick={onClose} className="rounded-lg border border-black/15 px-4 py-2.5">Cancelar</button>
        </div>
      </form>
    </div>
  );
}

function ProductRow({ product, onEdit, onDelete }) {
  const { addItem } = useCart();
  const { isAdmin } = useSession();
  const [noteOpen, setNoteOpen] = useState(false);
  const [note, setNote] = useState('');

  const handleAdd = () => {
    addItem({ id: product.id, kind: 'product', name: product.name, price: product.price }, note.trim());
    setNote('');
    setNoteOpen(false);
  };

  return (
    <li className={`py-3 ${product.active ? '' : 'opacity-40'}`}>
      <div className="leader-row">
        <span className="font-medium">{product.name}</span>
        <span className="leader-fill" />
        <span className="font-display text-[var(--red)]">{money(product.price)}</span>
      </div>
      {product.description && <p className="mt-0.5 text-xs text-[var(--charcoal)]/60">{product.description}</p>}
      <div className="mt-1.5 flex flex-wrap items-center gap-3 text-sm">
        <button onClick={handleAdd} className="font-semibold text-[var(--navy)] hover:underline">+ Agregar</button>
        <button onClick={() => setNoteOpen((v) => !v)} className="text-[var(--charcoal)]/60 hover:underline">
          {noteOpen ? 'Cerrar nota' : 'Agregar con nota'}
        </button>
        {isAdmin && (
          <>
            <button onClick={() => onEdit(product)} className="text-[var(--charcoal)]/60 hover:underline">Editar</button>
            <button onClick={() => onDelete(product.id)} className="text-[var(--charcoal)]/60 hover:text-[var(--red)] hover:underline">Eliminar</button>
          </>
        )}
      </div>
      {noteOpen && (
        <div className="mt-2 flex gap-2">
          <input autoFocus value={note} onChange={(e) => setNote(e.target.value)} placeholder="Ej: sabores de la docena, sin cebolla, etc."
            className="flex-1 rounded-lg border border-black/15 bg-white px-3 py-1.5 text-sm" />
          <button onClick={handleAdd} className="rounded-lg bg-[var(--navy)] px-3 py-1.5 text-sm font-semibold text-[var(--cream)]">Agregar</button>
        </div>
      )}
    </li>
  );
}

const CATEGORY_LABELS = { pizzas: 'Pizzas', empanadas: 'Empanadas', especialidades: 'Especialidades' };
const CATEGORY_ORDER = ['pizzas', 'empanadas', 'especialidades'];

function MenuSection() {
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [newCategory, setNewCategory] = useState(null);
  const { isAdmin } = useSession();

  const load = async () => {
    setLoading(true);
    const { data, error } = await db.from(TABLES.products).select('*').order('sort_order', { ascending: true });
    if (!error) setProducts(data || []);
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const handleDelete = async (id) => {
    if (!confirm('¿Eliminar este producto?')) return;
    await db.from(TABLES.products).delete().eq('id', id);
    load();
  };

  const grouped = CATEGORY_ORDER.map((cat) => ({
    key: cat,
    label: CATEGORY_LABELS[cat],
    items: products.filter((p) => p.category === cat && (isAdmin || p.active)),
  })).filter((g) => g.items.length > 0 || isAdmin);

  return (
    <section id="menu" className="mx-auto max-w-5xl px-4 py-14">
      <h2 className="font-display text-center text-3xl text-[var(--navy)]">Nuestro menú</h2>
      <p className="mx-auto mt-2 max-w-md text-center text-sm text-[var(--charcoal)]/60">
        Todo hecho al momento. Elegí, agregá al pedido y lo mandamos por WhatsApp.
      </p>
      {loading && <p className="mt-8 text-center text-sm text-[var(--charcoal)]/50">Cargando menú…</p>}
      <div className="mt-10 grid gap-10 sm:grid-cols-2">
        {grouped.map((group) => (
          <div key={group.key}>
            <div className="mb-2 flex items-center justify-between border-b-2 border-[var(--navy)] pb-1">
              <h3 className="font-display text-lg text-[var(--navy)]">{group.label}</h3>
              {isAdmin && (
                <button onClick={() => setNewCategory(group.key)} className="text-xs font-semibold text-[var(--red)] hover:underline">+ Agregar</button>
              )}
            </div>
            <ul className="divide-y divide-black/5">
              {group.items.map((product) => (
                <ProductRow key={product.id} product={product} onEdit={setEditing} onDelete={handleDelete} />
              ))}
              {group.items.length === 0 && <li className="py-3 text-sm text-[var(--charcoal)]/40">Todavía no hay productos acá.</li>}
            </ul>
          </div>
        ))}
      </div>
      {editing && <ProductFormModal product={editing} onClose={() => setEditing(null)} onSaved={() => { setEditing(null); load(); }} />}
      {newCategory && (
        <ProductFormModal product={{}} defaultCategory={newCategory} onClose={() => setNewCategory(null)} onSaved={() => { setNewCategory(null); load(); }} />
      )}
    </section>
  );
}

function Cart() {
  const { items, updateQty, removeItem, total, isOpen, setIsOpen, clearCart } = useCart();
  const { customerName, setProfileOpen } = useSession();

  if (!isOpen) return null;

  const handleCheckout = () => {
    if (!customerName) { setIsOpen(false); setProfileOpen(true); return; }
    openWhatsAppOrder(customerName, items, total);
  };

  return (
    <div className="fixed inset-0 z-40 flex justify-end bg-black/50" onClick={() => setIsOpen(false)}>
      <aside className="flex h-full w-full max-w-sm flex-col bg-[var(--paper)] shadow-xl" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between border-b border-black/10 px-5 py-4">
          <h2 className="font-display text-xl text-[var(--navy)]">Tu pedido</h2>
          <button onClick={() => setIsOpen(false)} className="text-2xl leading-none text-[var(--charcoal)]/50">×</button>
        </div>
        <div className="flex-1 overflow-y-auto px-5 py-4">
          {items.length === 0 ? (
            <p className="mt-8 text-center text-sm text-[var(--charcoal)]/50">Todavía no agregaste nada. Elegí algo del menú para empezar.</p>
          ) : (
            <ul className="space-y-4">
              {items.map((item) => (
                <li key={item.key} className="flex items-start justify-between gap-3">
                  <div className="flex-1">
                    <p className="font-medium">{item.name}</p>
                    {item.note && <p className="text-xs text-[var(--charcoal)]/60">Nota: {item.note}</p>}
                    <p className="text-sm text-[var(--red)]">{money(item.price * item.qty)}</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => updateQty(item.key, -1)} className="h-7 w-7 rounded-full border border-black/15 text-sm">−</button>
                    <span className="w-4 text-center text-sm">{item.qty}</span>
                    <button onClick={() => updateQty(item.key, 1)} className="h-7 w-7 rounded-full border border-black/15 text-sm">+</button>
                  </div>
                  <button onClick={() => removeItem(item.key)} className="text-xs text-[var(--charcoal)]/40 hover:text-[var(--red)]">Quitar</button>
                </li>
              ))}
            </ul>
          )}
        </div>
        {items.length > 0 && (
          <div className="border-t border-black/10 px-5 py-4">
            <div className="mb-3 flex items-center justify-between font-display text-lg text-[var(--navy)]">
              <span>Total</span><span>{money(total)}</span>
            </div>
            {customerName && <p className="mb-2 text-xs text-[var(--charcoal)]/50">Pedido a nombre de {customerName}</p>}
            <button onClick={handleCheckout} className="w-full rounded-full bg-[#25D366] py-3 font-semibold text-white transition hover:brightness-95">
              Enviar pedido por WhatsApp
            </button>
            <button onClick={clearCart} className="mt-2 w-full text-center text-xs text-[var(--charcoal)]/50 hover:underline">Vaciar carrito</button>
          </div>
        )}
      </aside>
    </div>
  );
}

function Footer() {
  return (
    <footer className="bg-[var(--navy)] py-8 text-center text-sm text-[var(--cream)]/60">
      <p className="font-display text-lg text-[var(--cream)]">FREE MAN</p>
      <p className="mt-1">{STORE_ADDRESS}</p>
      <p className="mt-1">Pedidos por WhatsApp · ¡Gracias por elegirnos!</p>
    </footer>
  );
}

function App() {
  return (
    <SessionProvider>
      <CartProvider>
        <Header />
        <Hero />
        <PromoBoard />
        <MenuSection />
        <Footer />
        <Cart />
        <ProfileModal />
      </CartProvider>
    </SessionProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
