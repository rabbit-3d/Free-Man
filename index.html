// Horarios de atención. "days" son los índices de día de JS
// (0 = domingo ... 6 = sábado). Las horas son las de Argentina
// (no dependen de la zona horaria del celular de quien mira la web).
const SCHEDULE = [
  { label: 'Lunes a jueves', days: [1, 2, 3, 4], open: '19:00', close: '01:00' },
  { label: 'Viernes y sábado', days: [5, 6], open: '19:00', close: '03:00' },
  { label: 'Domingo', days: [0], open: '19:00', close: '01:30' },
];

function getArgentinaNow() {
  // Argentina está fija en UTC-3 todo el año (sin horario de verano).
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utcMs - 3 * 60 * 60 * 1000);
}

function isStoreOpenNow() {
  const now = getArgentinaNow();
  const day = now.getDay();
  const minutesNow = now.getHours() * 60 + now.getMinutes();

  // Puede estar abierto por el horario de hoy, o seguir abierto de la
  // madrugada por el horario de ayer que cruzó la medianoche.
  const yesterday = (day + 6) % 7;
  const openByToday = (() => {
    const rule = SCHEDULE.find((r) => r.days.includes(day));
    if (!rule) return false;
    const [oh, om] = rule.open.split(':').map(Number);
    return minutesNow >= oh * 60 + om;
  })();
  const openByYesterday = (() => {
    const rule = SCHEDULE.find((r) => r.days.includes(yesterday));
    if (!rule) return false;
    const [ch, cm] = rule.close.split(':').map(Number);
    const closeMin = ch * 60 + cm;
    return closeMin <= 12 * 60 && minutesNow < closeMin; // el cierre "cruza" la madrugada
  })();

  return openByToday || openByYesterday;
}

const SessionContext = createContext(null);
const STORAGE_KEY = 'freeman_customer_name';

function SessionProvider({ children }) {
  const [customerName, setCustomerName] = useState('');
  const [isAdmin, setIsAdmin] = useState(false);
  const [profileOpen, setProfileOpen] = useState(false);

  useEffect(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) setCustomerName(saved);
  }, []);

  const submitIdentity = useCallback((value) => {
    const trimmed = value.trim();
    if (!trimmed) return null;
    if (trimmed === ADMIN_CODE) {
      setIsAdmin(true);
      return 'admin';
    }
    setCustomerName(trimmed);
    localStorage.setItem(STORAGE_KEY, trimmed);
    setIsAdmin(false);
    return 'saved';
  }, []);

  const logout = useCallback(() => {
    setIsAdmin(false);
    setCustomerName('');
    localStorage.removeItem(STORAGE_KEY);
  }, []);

  const value = { customerName, isAdmin, submitIdentity, logout, profileOpen, setProfileOpen };
  return <SessionContext.Provider value={value}>{children}</SessionContext.Provider>;
}
const useSession = () => useContext(SessionContext);

// ============================================================
const CartContext = createContext(null);

function CartProvider({ children }) {
  const [items, setItems] = useState([]);
  const [isOpen, setIsOpen] = useState(false);
  const [orderNote, setOrderNote] = useState('');

  const addItem = useCallback((entry) => {
    setItems((prev) => {
      const key = `${entry.kind}-${entry.id}`;
      const existing = prev.find((i) => i.key === key);
      if (existing) return prev.map((i) => (i.key === key ? { ...i, qty: i.qty + 1 } : i));
      return [...prev, { key, id: entry.id, kind: entry.kind, name: entry.name, price: entry.price, qty: 1 }];
    });
    setIsOpen(true);
  }, []);

  const updateQty = useCallback((key, delta) => {
    setItems((prev) => prev.map((i) => (i.key === key ? { ...i, qty: i.qty + delta } : i)).filter((i) => i.qty > 0));
  }, []);

  const removeItem = useCallback((key) => setItems((prev) => prev.filter((i) => i.key !== key)), []);
  const clearCart = useCallback(() => { setItems([]); setOrderNote(''); }, []);

  const total = useMemo(() => items.reduce((sum, i) => sum + i.price * i.qty, 0), [items]);
  const count = useMemo(() => items.reduce((sum, i) => sum + i.qty, 0), [items]);

  const value = { items, addItem, updateQty, removeItem, clearCart, total, count, isOpen, setIsOpen, orderNote, setOrderNote };
  return <CartContext.Provider value={value}>{children}</CartContext.Provider>;
}
const useCart = () => useContext(CartContext);

function buildOrderMessage(customerName, items, total, orderNote) {
  const lines = [];
  lines.push(`¡Hola Free Man Pizzería! Soy ${customerName} y quiero hacer este pedido:`);
  lines.push('');
  items.forEach((i) => {
    const label = i.kind === 'promo' ? `${i.name} (promo)` : i.name;
    lines.push(`• ${i.qty}x ${label} — ${money(i.price * i.qty)}`);
  });
  lines.push('');
  lines.push(`Total: ${money(total)}`);
  if (orderNote && orderNote.trim()) {
    lines.push('');
    lines.push(`Nota: ${orderNote.trim()}`);
  }
  return lines.join('\n');
}

function openWhatsAppOrder(customerName, items, total, orderNote) {
  const message = buildOrderMessage(customerName, items, total, orderNote);
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank', 'noopener,noreferrer');
}

function PromoFormModal({ promo, onClose, onSaved }) {
  const isNew = !promo.id;
  const [title, setTitle] = useState(promo.title || '');
  const [description, setDescription] = useState(promo.description || '');
  const [price, setPrice] = useState(promo.price ?? '');
  const [active, setActive] = useState(promo.active ?? true);
  const [saving, setSaving] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSaving(true);
    const payload = { title, description, price: Number(price) || 0, active };
    if (isNew) await db.from(TABLES.promos).insert(payload);
    else await db.from(TABLES.promos).update(payload).eq('id', promo.id);
    setSaving(false);
    onSaved();

function ProductFormModal({ product, defaultCategory, onClose, onSaved }) {
  const isNew = !product.id;
  const CATEGORIES = [
    { value: 'pizzas', label: 'Pizzas' },
    { value: 'empanadas', label: 'Empanadas' },
    { value: 'especialidades', label: 'Especialidades' },

  const [name, setName] = useState(product.name || '');
  const [category, setCategory] = useState(product.category || defaultCategory || 'pizzas');
  const [price, setPrice] = useState(product.price ?? '');
  const [description, setDescription] = useState(product.description || '');
  const [active, setActive] = useState(product.active ?? true);
  const [saving, setSaving] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSaving(true);

    else await db.from(TABLES.products).update(payload).eq('id', product.id);

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 p-4 sm:items-center" onClick={onClose}>
      <form onSubmit={handleSubmit} onClick={(e) => e.stopPropagation()} className="w-full max-w-sm rounded-2xl bg-[var(--paper)] p-6 shadow-xl">

        <label className="mt-3 block text-sm font-medium">Categoría</label>
        <select value={category} onChange={(e) => setCategory(e.target.value)} className="mt-1 w-full rounded-lg border border-black/15 bg-white px-3 py-2">

        <label className="mt-3 block text-sm font-medium">Precio</label>
        <input required type="number" min="0" value={price} onChange={(e) => setPrice(e.target.value)} className="mt-1 w-full rounded-lg border border-black/15 bg-white px-3 py-2" />

          <button type="button" onClick={onClose} className="rounded-lg border border-black/15 px-4 py-2.5">Cancelar</button>
        </div>
      </form>
    </div>
  );
}

const EMPANADA_FLAVORS = ['Jamón y queso', 'Cebolla y muzzarela', 'Caprese', 'Roquefort'];
const DOZEN_UNITS = 2; // 1 unidad = media docena (6 empanadas). 2 unidades = 1 docena.

function isDozenProduct(product) {
  return product.category === 'empanadas' && /docena/i.test(product.name);
}

function EmpanadaMixPicker({ onConfirm }) {
  const emptyCounts = () => Object.fromEntries(EMPANADA_FLAVORS.map((f) => [f, 0]));
  const [counts, setCounts] = useState(emptyCounts);
  const [justAdded, setJustAdded] = useState(false);
  const totalUnits = Object.values(counts).reduce((a, b) => a + b, 0);
  const remaining = DOZEN_UNITS - totalUnits;

  const inc = (f) => setCounts((c) => (remaining > 0 ? { ...c, [f]: c[f] + 1 } : c));
  const dec = (f) => setCounts((c) => (c[f] > 0 ? { ...c, [f]: c[f] - 1 } : c));
  const reset = () => setCounts(emptyCounts());

  const handleConfirm = () => {
    const chosen = EMPANADA_FLAVORS.filter((f) => counts[f] > 0);
    const label = chosen.map((f) => `${counts[f] * 6} ${f}`).join(' + ');
    onConfirm(label);
    setJustAdded(true);
    reset();
    setTimeout(() => setJustAdded(false), 1200);
  };

  return (
    <div className="mt-3 rounded-xl border border-black/10 bg-white p-4">
      <p className="font-display text-base text-[var(--navy)]">Armá tu docena</p>
      <p className="mt-0.5 text-xs text-charcoal-60">Elegí los sabores, de a media docena (6).</p>

      <ul className="mt-3 space-y-2.5">
        {EMPANADA_FLAVORS.map((f) => (
          <li key={f} className="flex items-center justify-between gap-3">
            <span className="text-sm font-medium">{f}</span>
            <div className="flex items-center gap-2">
              <button onClick={() => dec(f)} className="flex h-8 w-8 items-center justify-center rounded-full border border-black/15 text-base">−</button>
              <span className="w-10 text-center text-sm">{counts[f] * 6}</span>
              <button onClick={() => inc(f)} disabled={remaining <= 0} className="flex h-8 w-8 items-center justify-center rounded-full border border-black/15 text-base disabled:opacity-30">+</button>
            </div>
          </li>
        ))}
      </ul>

      <p className="mt-3 text-center text-sm font-semibold text-[var(--navy)]">
        {totalUnits * 6} de 12 elegidas
      </p>

      <div className="mt-4 flex gap-2">
        <button
          onClick={handleConfirm}
          disabled={totalUnits !== DOZEN_UNITS}
          className={`flex-1 rounded-full py-2.5 text-sm font-semibold text-white shadow-sm transition disabled:opacity-40 ${
            justAdded ? 'bg-emerald-500' : 'bg-[var(--red)]'
          }`}
        >
          {justAdded ? 'Agregado ✓' : 'Agregar al pedido'}
        </button>
        <button onClick={reset} className="rounded-full border border-black/15 px-4 py-2.5 text-sm">Vaciar</button>
      </div>
    </div>
  );
}

function HalfPizzaModal({ pizzas, onClose, onConfirm }) {
  const [idA, setIdA] = useState(pizzas[0]?.id ?? null);
  const [idB, setIdB] = useState(pizzas[1]?.id ?? pizzas[0]?.id ?? null);

  const pizzaA = pizzas.find((p) => p.id === idA);
  const pizzaB = pizzas.find((p) => p.id === idB);
  const price = pizzaA && pizzaB ? Math.max(pizzaA.price, pizzaB.price) : 0;

  const handleConfirm = () => {
    if (!pizzaA || !pizzaB) return;
    onConfirm(pizzaA, pizzaB, price);
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/50 p-4 sm:items-center" onClick={onClose}>
      <div className="w-full max-w-sm rounded-2xl bg-[var(--paper)] p-6 shadow-xl" onClick={(e) => e.stopPropagation()}>

        <p className="mt-1 text-sm text-charcoal-70">Se cobra el valor de la mitad más cara.</p>

        <label className="mt-4 block text-sm font-medium">Primera mitad</label>
        <select value={idA ?? ''} onChange={(e) => setIdA(Number(e.target.value))} className="mt-1 w-full rounded-lg border border-black/15 bg-white px-3 py-2">
          {pizzas.map((p) => <option key={p.id} value={p.id}>{p.name} — {money(p.price)}</option>)}
        </select>

        <label className="mt-3 block text-sm font-medium">Segunda mitad</label>
        <select value={idB ?? ''} onChange={(e) => setIdB(Number(e.target.value))} className="mt-1 w-full rounded-lg border border-black/15 bg-white px-3 py-2">
          {pizzas.map((p) => <option key={p.id} value={p.id}>{p.name} — {money(p.price)}</option>)}
        </select>

        {pizzaA && pizzaB && (
          <p className="mt-4 text-center font-display text-lg text-[var(--navy)]">
            Media {pizzaA.name} + Media {pizzaB.name} — {money(price)}
          </p>
        )}

        <div className="mt-5 flex gap-2">
          <button onClick={handleConfirm} className="flex-1 rounded-full bg-[var(--red)] py-2.5 font-semibold text-white">
            Agregar al pedido
          </button>
          <button onClick={onClose} className="rounded-full border border-black/15 px-4 py-2.5">Cancelar</button>
        </div>
      </div>
    </div>
  );
}

function ProductRow({ product, onEdit, onDelete }) {

  const isDozen = isDozenProduct(product);

  const flashAdded = () => {
    setJustAdded(true);
    setTimeout(() => setJustAdded(false), 700);
  };

  const handleAdd = () => {
    addItem({ id: product.id, kind: 'product', name: product.name, price: product.price });
    flashAdded();
  };

  const handleMixConfirm = (label) => {
    addItem({
      id: `${product.id}-${label}`,
      kind: 'product',
      name: `${product.name} (${label})`,
      price: product.price,
    });

  return (
    <li className={`py-3 ${product.active ? '' : 'opacity-40'}`}>
      <div className="flex items-start gap-3">
        <div className="min-w-0 flex-1">
          <div className="leader-row">
            <span className="font-medium">{product.name}</span>

        {!isDozen && (
          <button
            onClick={handleAdd}
            className={`shrink-0 rounded-full px-4 py-2 text-sm font-semibold text-white shadow-sm transition active:scale-95 ${
              justAdded ? 'bg-emerald-500' : 'bg-[var(--red)] hover:brightness-110'
            }`}
          >
            {justAdded ? 'Agregado ✓' : '+ Agregar'}

        )}

      {isDozen && <EmpanadaMixPicker onConfirm={handleMixConfirm} />}

    </SessionProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
